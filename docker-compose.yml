services:
  # MySQL 保存 Spring Boot 业务数据：
  # 知识库、文档状态、聊天会话、聊天消息，后续也可以保存用户和权限。
  mysql:
    image: mysql:8.4
    container_name: rag-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-rag_knowledge_base}
      MYSQL_USER: ${MYSQL_USER:-rag_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-rag_password}
    ports:
      # 宿主机 3306 经常会被本机 MySQL 占用，所以这里用 3307 暴露给 Spring Boot。
      # 容器内部仍然是 MySQL 默认端口 3306。
      - "3307:3306"
    restart: unless-stopped
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u\"$${MYSQL_USER}\" -p\"$${MYSQL_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Qdrant 保存 RAG chunk 的向量和 payload。
  qdrant:
    image: qdrant/qdrant:v1.14.1
    container_name: rag-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    restart: unless-stopped
    volumes:
      - qdrant_storage:/qdrant/storage

  # Redis 保存短期、高频状态：
  # AI 接口限流计数、防重复提交锁、后续可扩展为短期缓存。
  redis:
    image: redis:7-alpine
    container_name: rag-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # FastAPI RAG 服务。
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-api
    env_file:
      - .env
    environment:
      # 容器之间通过 service name 通信，所以这里使用 qdrant，不使用 127.0.0.1。
      QDRANT_URL: http://qdrant:6333
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    restart: unless-stopped
    depends_on:
      - qdrant
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Spring Boot 业务后端和静态前端页面。
  backend:
    build:
      context: ./springboot-backend
      dockerfile: Dockerfile
    container_name: rag-backend
    env_file:
      - .env
    environment:
      # 容器之间通过 service name 通信，所以这里使用 mysql:3306，不使用宿主机的 127.0.0.1:3307。
      MYSQL_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-rag_knowledge_base}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      MYSQL_USER: ${MYSQL_USER:-rag_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-rag_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      UPLOAD_LOCK_ENABLED: ${UPLOAD_LOCK_ENABLED:-true}
      UPLOAD_LOCK_TTL_SECONDS: ${UPLOAD_LOCK_TTL_SECONDS:-300}
      # Spring Boot 调用 FastAPI 时走 Docker 内部网络。
      FASTAPI_BASE_URL: http://api:8000
    ports:
      - "8080:8080"
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      api:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mysql_data:
  qdrant_storage:
  redis_data:
