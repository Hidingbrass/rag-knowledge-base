spring:
  datasource:
    # 测试使用 H2 内存数据库，避免依赖本机 MySQL 是否启动。
    url: jdbc:h2:mem:aikb_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      # 测试也走 Flyway 建表，避免生产表结构和测试表结构两套逻辑。
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        type:
          preferred_uuid_jdbc_type: BINARY
  flyway:
    enabled: true
    locations: classpath:db/migration
