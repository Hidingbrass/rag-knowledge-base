spring:
  datasource:
    # 测试使用 H2 内存数据库，避免依赖本机 MySQL 是否启动。
    url: jdbc:h2:mem:aikb_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      # 测试也走 Flyway 建表，避免生产表结构和测试表结构两套逻辑。
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        type:
          preferred_uuid_jdbc_type: BINARY
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      repositories:
        enabled: false

ai:
  rate-limit:
    enabled: false
    per-minute: 5
    per-day: 100

upload:
  lock:
    enabled: false
    ttl-seconds: 300

auth:
  security:
    # 现有 Controller 测试覆盖旧版参数身份流程；严格鉴权由 StrictAuthenticationTests 单独覆盖。
    allow-legacy-identity-parameters: true
  jwt:
    secret: test-only-change-me-to-a-long-random-secret
    expires-in-seconds: 86400
